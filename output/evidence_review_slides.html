@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;
  --bg: #fafafa;
  --dark-bg: #0f1b2d;
  --alt-row: #edf2f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }
section::after { content: none; }

/* CEGA branding */
.brand { position: absolute; bottom: 10px; left: 22px; width: 84px; height: 40px; background-repeat: no-repeat; background-size: contain; background-position: left center; opacity: 0.92; }

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;
  --bg: #fafafa;
  --dark-bg: #0f1b2d;
  --alt-row: #edf2f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }
section::after { content: none; }

/* CEGA branding */
.brand { position: absolute; bottom: 10px; left: 22px; width: 84px; height: 40px; background-repeat: no-repeat; background-size: contain; background-position: left center; opacity: 0.92; }

;" data-size="16:9"><div class="slide">
  <h1>Why a Pipeline &mdash; Rapid Review at Scale</h1>
  <div class="two-col">
    <div class="col">
      <h2 style="color:var(--mid-blue);">A human rapid review is time-intensive</h2>
      <ul class="x-list">
        <li>Screening <strong>thousands of abstracts by hand</strong> &mdash; a single-question rapid review typically takes weeks to months</li>
        <li>Manual extraction of effect sizes, confidence intervals and study designs, paper by paper</li>
        <li>Synthesising across <strong>15 interventions &times; hundreds of papers</strong> compounds the workload</li>
        <li>Screening and scoring choices are hard to document, audit and reproduce</li>
      </ul>
    </div>
    <div class="col">
      <h2 style="color:var(--red);">&hellip; but an unconstrained LLM is unreliable</h2>
      <ul class="x-list">
        <li><strong>Hallucinates</strong> effect sizes and fabricates citations</li>
        <li><strong>Leaks figures from training data</strong> with no provenance</li>
        <li>Cannot reliably <strong>search, deduplicate or rank</strong> at corpus scale</li>
        <li>Context limits &mdash; it cannot hold thousands of papers at once</li>
        <li>Misclassifies study types when it pattern-matches on titles</li>
      </ul>
    </div>
  </div>
  <div class="callout callout-amber">
    <h3>The gap to close</h3>
    <p>Speed needs automation; trust needs constraints. The pipeline supplies both &mdash; deterministic code does the search and ranking, and the LLM is fenced into a verified, citable corpus.</p>
  </div>
  <div class="brand brand-c"></div>
  <div class="slide-number">2</div>
</div>

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;
  --bg: #fafafa;
  --dark-bg: #0f1b2d;
  --alt-row: #edf2f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }
section::after { content: none; }

/* CEGA branding */
.brand { position: absolute; bottom: 10px; left: 22px; width: 84px; height: 40px; background-repeat: no-repeat; background-size: contain; background-position: left center; opacity: 0.92; }

<div class="slide">
  <h1 style="border-bottom-color:var(--green);">Our Approach &mdash; Code Ranks, the LLM Only Reads</h1>
  <p class="fig-caption" style="margin-bottom:14px;">Search and ranking are fully automated and <strong>LLM-free</strong>. The LLM enters only at the end, and only over the curated, ranked dataset &mdash; never the open web or its own memory.</p>
  <div class="two-col">
    <div class="col">
      <h2 style="color:var(--green);">The process</h2>
      <ul class="lim-list">
        <li><strong>Automated search</strong> &mdash; code scrapes PubMed + OpenAlex with curated MeSH / publication-type queries; <strong>no LLM</strong></li>
        <li><strong>Score + rank</strong> &mdash; deduplicate, enrich citations, and score on MeSH + publication type + population; keep the top 200; fully <strong>deterministic</strong></li>
        <li><strong>LLM reads</strong> &mdash; the model is handed <em>only the ranked papers</em> and pulls information from them, nothing else</li>
        <li><strong>Grounded synthesis</strong> &mdash; a corpus PMID on every number, then a verifier lints each claim against the corpus</li>
      </ul>
    </div>
    <div class="col">
      <h2 style="color:var(--navy);">Guardrails</h2>
      <ul class="check-list">
        <li>The LLM never decides relevance &mdash; <em>what to read</em> and <em>in what order</em> are solved deterministically before it is invoked</li>
        <li>Its purview is fenced to the ranked dataset &mdash; no open web, no training-data figures</li>
        <li>Prompts enforce systematic-review discipline: study type stated <strong>verbatim</strong> from metadata, a PMID for every figure, and <strong>no cost-effectiveness rating without a real CEA</strong></li>
      </ul>
    </div>
  </div>
  <div class="callout callout-green">
    <h3>Net effect</h3>
    <p>The speed of automation with the rigour of a systematic review &mdash; every claim traceable to a ranked, citable source.</p>
  </div>

</div>

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;
  --bg: #fafafa;
  --dark-bg: #0f1b2d;
  --alt-row: #edf2f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }
section::after { content: none; }

/* CEGA branding */
.brand { position: absolute; bottom: 10px; left: 22px; width: 84px; height: 40px; background-repeat: no-repeat; background-size: contain; background-position: left center; opacity: 0.92; }

      <h3>Reading the chart</h3>
      <p class="small" style="margin-top:4px;"><strong>Strong evidence + high readiness</strong> (top-right): strong evidence, a genuine favourable CEA, and a proven delivery platform — six interventions.</p>
      <p class="small" style="margin-top:6px;"><strong>Strong evidence + low readiness</strong> (bottom-right): robust evidence but higher unit cost or coverage gaps (CMAM, SQ-LNS, complementary feeding).</p>
      <p class="small" style="margin-top:6px;"><strong>Weak evidence + low readiness</strong> (bottom-left): WASH and cash transfers — small or indirect nutrition effects, and <strong>no intervention-specific CEA</strong> in the corpus → cost-effectiveness <em>Unknown</em>.</p>

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;
  --bg: #fafafa;
  --dark-bg: #0f1b2d;
  --alt-row: #edf2f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }
section::after { content: none; }

/* CEGA branding */

    <div class="fig-side">
      <h3>The MMS transition</h3>
      <p class="small" style="margin-top:4px;">Antenatal <strong>MMS</strong> cuts low birth weight vs iron-folic acid (RR 0.86, 95% CI 0.79–0.93; PMID 21673856) at <strong>$3–15 per DALY averted</strong> (PMID 35192606). WHO conditionally recommended the IFA → MMS transition.</p>
      <h3 style="margin-top:10px;">The adherence bottleneck</h3>
      <p class="small" style="margin-top:4px;">Pooled iron-folic acid compliance in sub-Saharan Africa is just <strong>39.2%</strong> (PMID 33852614) — coverage, not efficacy, is the binding constraint.</p>

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;
  --bg: #fafafa;
  --dark-bg: #0f1b2d;
  --alt-row: #edf2f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }
section::after { content: none; }

/* CEGA branding */
.brand { position: absolute; bottom: 10px; left: 22px; width: 84px; height: 40px; background-repeat: no-repeat; background-size: contain; background-position: left center; opacity: 0.92; }

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;
  --bg: #fafafa;
  --dark-bg: #0f1b2d;
  --alt-row: #edf2f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }
section::after { content: none; }

/* CEGA branding */
.brand { position: absolute; bottom: 10px; left: 22px; width: 84px; height: 40px; background-repeat: no-repeat; background-size: contain; background-position: left center; opacity: 0.92; }

  <h1>Large-Scale Food Fortification of Staple Foods</h1>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;">
    <span style="background:#eef2f7;color:var(--navy);border:1px solid #cdd8e3;border-radius:12px;padding:3px 11px;">Population: children + WRA</span>
    <span style="background:#e8f8e8;color:var(--green);border:1px solid #bcdcc4;border-radius:12px;padding:3px 11px;">Evidence: A</span>
    <span style="background:#e8f8e8;color:var(--green);border:1px solid #bcdcc4;border-radius:12px;padding:3px 11px;">Cost-effectiveness: High</span>

  <div class="two-col">
    <div class="col" style="flex:1.15;">
      <h3 style="color:var(--green);">Evidence (A)</h3>
      <ul class="lim-list">
        <li>LSFF umbrella SR/MA (vitamin A, iodine, iron, folic acid), <em>AJCN</em> 2019: anaemia <strong>&minus;34%</strong> (RR 0.66, 0.59&ndash;0.74), goitre <strong>&minus;74%</strong> (OR 0.26), NTD <strong>&minus;41%</strong> (OR 0.59) &mdash; PMID 30997493</li>
        <li>Double-fortified salt (iron + iodine), <em>Advances in Nutrition</em>: anaemia RR 0.59 (0.46&ndash;0.77); IDA RR 0.37 (0.25&ndash;0.54) &mdash; PMID 29767699</li>
        <li>Supporting Cochrane reviews: zinc fortification (PMID 27281654), vitamin A fortification (PMID 31074495)</li>
        <li>Fortified dairy / cereal (older children): weak, non-significant haemoglobin effect &mdash; PMID 30673769</li>
      </ul>
    </div>
    <div class="col" style="flex:0.85;">
      <h3 style="color:var(--green);">Cost-effectiveness (High)</h3>
      <ul class="lim-list">
        <li>SR of economic evaluations across <strong>63 countries</strong> (&gt;200 analyses): cost-effective for reducing malnutrition across most LMIC settings</li>
        <li>A genuine intervention-specific CEA was retrieved &rarr; rating permitted</li>
      </ul>
      <h3 style="color:var(--teal);margin-top:10px;">Scalability (Proven national)</h3>

        <li>Salt iodization and flour fortification are among the <strong>most widely scaled</strong> nutrition interventions globally</li>
        <li>Delivered through existing food-industry supply chains with regulatory mandates</li>
        <li>Minimal per-capita cost; no behaviour change required</li>
      </ul>

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;
  --bg: #fafafa;
  --dark-bg: #0f1b2d;
  --alt-row: #edf2f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }
section::after { content: none; }

/* CEGA branding */
.brand { position: absolute; bottom: 10px; left: 22px; width: 84px; height: 40px; background-repeat: no-repeat; background-size: contain; background-position: left center; opacity: 0.92; }

<div class="slide">
  <p style="font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--muted);margin:0 0 3px;">HUMAN REVIEW PASS &middot; LARGE-SCALE FOOD FORTIFICATION</p>
  <h1 style="border-bottom-color:var(--green);">What Worked Well</h1>
  <p class="fig-caption" style="margin-bottom:10px;">The pipeline auto-drafted syntheses for <strong>all 15 interventions</strong>. To test accuracy, a reviewer audited <strong>one</strong> end-to-end &mdash; large-scale fortification &mdash; checking every claim against the source corpus. It held up on all five.</p>
  <table style="font-size:13px;">
    <thead><tr><th style="width:40%;">What the LLM synthesis claimed</th><th style="width:13%;">Source</th><th>Human verification</th></tr></thead>
    <tbody>
      <tr><td>Anchor = large-scale fortification umbrella review (Keats, <em>AJCN</em> 2019)</td><td>PMID 30997493</td><td>&#10003; Correctly the <strong>#1-ranked paper</strong> of 1,996; classified as <em>AJCN</em> SR/MA &mdash; <strong>not</strong> mislabelled "Cochrane"</td></tr>
      <tr><td>Anaemia &minus;34% (RR 0.66); goitre &minus;74% (OR 0.26); NTD &minus;41% (OR 0.59)</td><td>30997493</td><td>&#10003; <strong>Verbatim</strong> in the abstract (all 95% CIs match)</td></tr>
      <tr><td>Double-fortified salt: anaemia RR 0.59; IDA RR 0.37</td><td>29767699</td><td>&#10003; Verbatim</td></tr>
      <tr><td>Fortified dairy / cereal: weak, non-significant effect</td><td>30673769</td><td>&#10003; <strong>Honest</strong> &mdash; null result flagged, not inflated</td></tr>
      <tr><td>Cost-effectiveness rated <strong>High</strong></td><td>63-country CEA</td><td>&#10003; <strong>Earned</strong> &mdash; a genuine fortification CEA was retrieved, not invented</td></tr>
    </tbody>
  </table>
  <div class="two-col" style="margin-top:12px;">
    <div class="col">
      <div class="callout callout-green" style="margin:0;">
        <h3>Accuracy verdict</h3>
        <p>Every reported effect size is grounded in its cited paper &mdash; the verifier returns <strong>0 not-in-corpus</strong>. Markedly cleaner than the earlier Vitamin&nbsp;A case: correct study types, no misattribution, cost-effectiveness backed by a real CEA.</p>
      </div>
    </div>
    <div class="col">
      <h3 style="color:var(--green);">Why it held up</h3>
      <p class="small" style="margin-top:4px;">The hard decisions were made by <strong>deterministic code, not the model</strong>: the LLM only ever saw a ranked set of real papers, the prompt demanded a corpus PMID for every figure, and the verifier flagged anything unsupported. An unconstrained model asked the same question would likely have invented a cost-per-DALY figure or mislabelled the umbrella review as Cochrane &mdash; exactly the failures seen in the earlier Vitamin&nbsp;A synthesis.</p>
    </div>
  </div>

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;
  --bg: #fafafa;
  --dark-bg: #0f1b2d;
  --alt-row: #edf2f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }
section::after { content: none; }

/* CEGA branding */
.brand { position: absolute; bottom: 10px; left: 22px; width: 84px; height: 40px; background-repeat: no-repeat; background-size: contain; background-position: left center; opacity: 0.92; }

  <p style="font-family:'Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--muted);margin:0 0 3px;">HUMAN REVIEW PASS &middot; LARGE-SCALE FOOD FORTIFICATION</p>
  <h1 style="border-bottom-color:var(--amber);">Limitations</h1>
  <div class="two-col">
    <div class="col" style="flex:1.12;">
      <h2 style="color:var(--amber);">Gaps found for this intervention</h2>
      <ul class="x-list">
        <li><strong>Completeness:</strong> no standalone <strong>wheat-flour</strong> or <strong>rice</strong> fortification review retrieved; salt iodization captured only via double-fortified salt</li>
        <li><strong>Below the cut:</strong> two relevant iron-fortification reviews (PMID 32318374, 37665781) are in the database but ranked outside the top 200</li>
        <li><strong>No trial-overlap detection:</strong> the umbrella review and the component reviews share underlying trials &mdash; apparent independence is slightly inflated</li>
        <li><strong>Noisy CEA bucket:</strong> the top cost-effectiveness hit was an off-topic micronutrient-powder study; only the #2 was a true fortification CEA</li>
        <li><strong>Minor imprecision:</strong> one SR mis-described as "Cochrane-adjacent"; scalability claims not corpus-cited</li>
      </ul>
    </div>
    <div class="col" style="flex:0.88;">
      <div class="callout callout-amber">
        <h3>But none produced a false claim</h3>
        <p>Each issue bounds how <em>complete</em> and <em>self-aware</em> the synthesis is &mdash; none introduced an unsupported number. The grounding rules and the verifier held.</p>
      </div>
      <h3 style="margin-top:12px;">Pipeline-wide caveats</h3>
      <ul class="lim-list" style="margin-top:4px;">
        <li>Population filter tightens retrieval &mdash; some relevant reviews fall below the top-200 cut</li>
        <li>~40% of top papers are abstract-only (effect sizes not full-text-verified)</li>
        <li><strong>Deferred:</strong> a trial-level evidence graph (shared- / dominant-trial detection) is the next milestone</li>
      </ul>
      <p class="footnote" style="margin-top:10px;">Takeaway: the pipeline is accurate on <em>what it reports</em>, but <strong>human review remains essential</strong> for completeness and structural judgement.</p>
    </div>
  </div>

@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap');

:root {
  --navy: #1b365d;
  --mid-blue: #2e5c8a;
  --teal: #0e7c7b;
  --green: #1e7a3c;
  --amber: #b8860b;
  --red: #c0392b;
  --text: #1a1a2e;
  --muted: #5a6c7d;
  --bg: #fafafa;
  --dark-bg: #0f1b2d;
  --alt-row: #edf2f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Source Serif 4', 'Georgia', serif; color: var(--text); line-height: 1.5; }

.slide { width: 100%; height: 100%; margin: 0; background: var(--bg); padding: 45px 55px; position: relative; box-shadow: none; overflow: hidden; }
.slide.dark { background: var(--dark-bg); color: #e0e0e0; }

.slide-number { position: absolute; bottom: 12px; right: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--muted); }
.dark .slide-number { color: #556677; }

h1 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy); border-bottom: 2.5px solid var(--teal); padding-bottom: 8px; margin-bottom: 16px; letter-spacing: 0.3px; }
.dark h1 { color: #7ec8c8; border-bottom-color: #7ec8c8; }
h2 { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--mid-blue); margin: 12px 0 8px; }
.dark h2 { color: #7ec8c8; }
h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--teal); margin: 10px 0 6px; }
p, li { font-size: 15px; line-height: 1.55; }
.small { font-size: 13.5px; }
.footnote { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 8px; }
.fig-caption { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); margin-bottom: 8px; }
.fig-caption strong { color: var(--navy); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
th { background: var(--navy); color: white; padding: 7px 10px; text-align: left; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
td { padding: 6px 10px; border: 1px solid #ddd; vertical-align: top; }
tr:nth-child(even) td { background: var(--alt-row); }
.dark th { background: #1a3a5c; }
.dark td { background: #152238; border-color: #2a3a54; color: #e0e0e0; }
.dark tr:nth-child(even) td { background: #1a2a44; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; margin: 12px 0; }
.stage { flex: 1; background: white; border: 1.5px solid var(--mid-blue); padding: 10px 12px; position: relative; margin-right: 28px; }
.stage:last-child { margin-right: 0; }
.stage-header { font-family: 'Inter', sans-serif; background: var(--mid-blue); color: white; margin: -10px -12px 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stage-header span { display: block; font-weight: 400; font-size: 11.5px; letter-spacing: 0; margin-top: 1px; }
.stage ul { list-style: none; padding: 0; }
.stage li { font-size: 12px; padding: 2px 0; color: var(--text); }
.stage li::before { content: &quot;·&quot;; margin-right: 5px; color: var(--mid-blue); font-weight: bold; }
.stage .stat { margin-top: 8px; background: #e8f4fd; padding: 4px 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--mid-blue); border-radius: 2px; }
.stage.final .stage-header { background: var(--green); }
.stage.final { border-color: var(--green); }
.stage.final .stat { background: #e8f8e8; color: var(--green); }
.arrow { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--mid-blue); }
.scoring-bar { display: flex; gap: 4px; margin-top: 10px; }
.score-chip { flex: 1; background: var(--navy); color: white; text-align: center; padding: 5px 4px; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; line-height: 1.3; }
.score-chip span { display: block; color: #7ec8c8; font-size: 11px; margin-top: 2px; }

/* Two-column layout */
.two-col { display: flex; gap: 25px; }
.col { flex: 1; }
.check-list, .x-list { list-style: none; padding: 0; }
.check-list li, .x-list li { padding: 5px 0 5px 24px; position: relative; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid #eee; }
.check-list li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--green); font-weight: 700; font-size: 16px; }
.x-list li::before { content: &quot;✗&quot;; position: absolute; left: 0; color: var(--red); font-weight: 700; font-size: 16px; }
.x-list li strong { color: var(--red); }

.callout { border: 2px solid; padding: 12px 14px; margin: 10px 0; font-size: 12.5px; line-height: 1.5; }
.callout-amber { border-color: var(--amber); background: #fdf8e8; }
.callout-red { border-color: var(--red); background: #fde8e8; }
.callout-green { border-color: var(--green); background: #e8f8e8; }
.callout h3 { margin: 0 0 6px; font-size: 13.5px; }
.callout-amber h3 { color: var(--amber); }
.callout-red h3 { color: var(--red); }
.callout-green h3 { color: var(--green); }

/* Summary */
.funnel { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.funnel-step { text-align: center; border: 1.5px solid; padding: 8px 16px; min-width: 100px; font-family: 'Inter', sans-serif; }
.funnel-step .num { font-size: 24px; font-weight: 700; display: block; }
.funnel-step .label { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
.funnel-arrow { font-size: 18px; color: #556677; }
.lim-list { list-style: none; padding: 0; }
.lim-list li { padding: 4px 0 4px 18px; position: relative; font-size: 14px; line-height: 1.5; }
.lim-list li::before { content: &quot;▸&quot;; position: absolute; left: 0; color: var(--amber); font-weight: bold; }

/* SVG figure styling */
.fig-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.fig-panel { flex-shrink: 0; }
.fig-side { flex: 1; min-width: 0; }
section { padding: 0; margin: 0; }
section::after { content: none; }

/* CEGA branding */
.brand { position: absolute; bottom: 10px; left: 22px; width: 84px; height: 40px; background-repeat: no-repeat; background-size: contain; background-position: left center; opacity: 0.92; }
